services:
  receiver:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - captures:/data/captures
    # Not published to the host - only Caddy talks to this, over the
    # internal Docker network by service name ("receiver:8642").
    expose:
      - "8642"

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    env_file: .env
    environment:
      CLOUDSHARK_LOG_PATH: /data/caddy_access.log
      CLOUDSHARK_UPSTREAM: receiver:8642
    ports:
      - "${CLOUDSHARK_PORT:-8443}:${CLOUDSHARK_PORT:-8443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - receiver

volumes:
  captures:
  caddy_data:
  caddy_config:
